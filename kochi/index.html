<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metro Tickets — Kochi</title>
  <meta name="description" content="Buy Kochi Metro tickets from an authorised ONDC seller." />
  <link rel="icon" type="image/svg+xml" href="https://d3vjh3qb9shw0m.cloudfront.net/37629/47870/favicon/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-17W29WN58K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-17W29WN58K');

    function getOS() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      if (/android/i.test(ua)) return 'Android';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'iOS';
      return 'Other';
    }

    var os = getOS();
    gtag('set', 'user_properties', { platform_os: os });

    document.addEventListener('DOMContentLoaded', function () {
      gtag('event', 'platform_detected', { platform_os: os });

      document.querySelectorAll('.seller-item a').forEach(function (link) {
        link.addEventListener('click', function () {
          var label = link.querySelector('.seller-label');
          gtag('event', 'buyer_app_click', {
            app_name: label ? label.textContent.trim() : 'unknown',
            platform_os: os,
            destination_url: link.href
          });
        });
      });
    });
  </script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1E293B;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app-root {
      width: 100%;
      max-width: 430px;
      min-height: calc(100dvh - 64px);
      background: #F4F6F9;
      border-radius: 40px;
      overflow: clip;
      box-shadow: 0 0 0 6px rgba(255,255,255,.06), 0 24px 80px rgba(0,0,0,.55);
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    .ondc-navbar {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .ondc-navbar-inner {
      max-width: 580px;
      margin: 0 auto;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ondc-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .ondc-logo-img {
      height: 36px;
      width: auto;
      display: block;
    }

    .ondc-navbar-product {
      font-size: .75rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-left: 1.5px solid #e2e8f0;
      padding-left: 14px;
    }

    /* ── Hero header ── */
    .header {
      width: 100%;
      background: linear-gradient(140deg, #1c75bc 0%, #0e9cd8 60%, #00aeef 100%);
      padding: 12px 16px 14px;
      display: flex;
      justify-content: center;
    }

    .header-hero {
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .metro-icon-svg {
      height: 56px;
      width: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .25));
      animation: metro-float 3s ease-in-out infinite;
    }

    @keyframes metro-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: #fff;
      line-height: 1.15;
    }

    .header-subtitle {
      font-size: .9rem;
      color: rgba(255, 255, 255, .85);
      font-weight: 400;
      line-height: 1.5;
    }

    /* ── Main content ── */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Seller list ── */
    .seller-list {
      list-style: none;
      padding: 4px 0;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .seller-item a {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 60px;
      min-height: 48px;
      border-radius: 40px;
      text-decoration: none;
      color: #0d2137;
      font-weight: 600;
      font-size: .97rem;
      border: 1.5px solid #e8f0f8;
      background: #fafbff;
      transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
    }

    .seller-item a:hover {
      background: #eef4ff;
      border-color: #bad3f5;
      box-shadow: 0 4px 16px rgba(28, 117, 188, .13);
      transform: translateY(-1px);
    }

    .seller-item a:active {
      transform: translateY(0);
      background: #deeaff;
    }

    .seller-name {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .seller-logo {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .seller-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .seller-logo--lg {
      width: 54px;
      height: 54px;
    }

    .seller-logo--dark {
      background: #1a1a2e;
      border-radius: 10px;
    }

    .seller-label {
      white-space: normal;
      line-height: 1.2;
    }


    /* ── Footer ── */
    .app-footer {
      background: #0D2137;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      position: sticky;
      bottom: 0;
      z-index: 100;
    }

    .app-footer-inner {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: .73rem;
      color: rgba(255, 255, 255, .5);
      letter-spacing: .025em;
      text-align: center;
    }

    .app-footer-brand {
      color: #00aeef;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .app-footer-sep {
      color: rgba(255, 255, 255, .25);
    }

    /* ── Responsive ── */
    @media (min-width: 640px) {
      .ondc-navbar-inner { padding: 0 24px; }
      .header { padding: 18px 24px 20px; }
      .metro-icon-svg { height: 64px; }
      .header-title { font-size: 1.9rem; }
      .app-content { padding: 36px 24px 48px; }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: #F4F6F9;
        display: block;
      }
      .app-root {
        max-width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
