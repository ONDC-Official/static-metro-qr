<!DOCTYPE html>
<html lang="en">

      name="description"
      content="Buy {{GROUP_NAME}} Metro tickets from an authorised {{ORG_NAME}} seller."
    />

      property="og:title"
      content="Metro Tickets — {{GROUP_NAME}} | {{ORG_NAME}}"

    <link rel="icon" type="image/png" href="/public/images/favicon.png" />
